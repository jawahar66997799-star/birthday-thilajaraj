<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Thilajaraj</title>
<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ff6a88,#ffcc70);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}
.card{
  background:white;
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
h1{font-size:48px;color:#ff4081;}
h2{font-size:32px;color:#333;}
p{font-size:20px;}
.balloons{
  font-size:40px;
  animation:float 2s infinite alternate;
}
@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-15px);}
}
</style>
</head>
<body>
<div class="card">
  <div class="balloons">🎈🎉🎈🎉🎈</div>
  <h1>🎂 Happy Birthday 🎂</h1>
  <h2>✨ Thilajaraj ✨</h2>
  <p>May your life be filled with happiness,<br>
  success & good health 💫</p>
  <p>🎁🎊 Have a wonderful year ahead 🎊🎁</p>
</div>
</body>
</html>
